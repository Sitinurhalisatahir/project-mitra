<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="50%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4338CA" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="36" fill="url(#bgGrad)"/>

  <!-- Decorative circles / ambient glow -->
  <circle cx="680" cy="140" r="180" fill="#818CF8" fill-opacity="0.25"/>
  <circle cx="120" cy="480" r="140" fill="#FCD34D" fill-opacity="0.22"/>
  <circle cx="400" cy="300" r="260" fill="#6366F1" fill-opacity="0.06"/>

  <!-- Subtle Grid Dots -->
  <g fill="#94A3B8" opacity="0.3">
    <circle cx="80" cy="80" r="2"/><circle cx="120" cy="80" r="2"/><circle cx="160" cy="80" r="2"/>
    <circle cx="80" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="160" cy="120" r="2"/>
    <circle cx="640" cy="460" r="2"/><circle cx="680" cy="460" r="2"/><circle cx="720" cy="460" r="2"/>
    <circle cx="640" cy="500" r="2"/><circle cx="680" cy="500" r="2"/><circle cx="720" cy="500" r="2"/>
  </g>

  <!-- Connection Lines (Collaboration Network) -->
  <path d="M 230 250 Q 400 170 570 230" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M 240 370 Q 400 450 560 380" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.5"/>
  <path d="M 400 160 L 400 460" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Main Central Collaboration Workspace Card -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="110" width="440" height="380" rx="24" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Card Header Bar -->
    <rect x="180" y="110" width="440" height="54" rx="24" fill="#F1F5F9"/>
    <rect x="180" y="140" width="440" height="24" fill="#F1F5F9"/>
    <circle cx="212" cy="137" r="6" fill="#EF4444"/>
    <circle cx="230" cy="137" r="6" fill="#F59E0B"/>
    <circle cx="248" cy="137" r="6" fill="#10B981"/>
    
    <text x="400" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">
      SkillMatch • Tim Hackathon 2026
    </text>

    <!-- Workspace Inner Content -->
    <!-- Project Banner -->
    <rect x="210" y="180" width="380" height="74" rx="14" fill="#EEF2FF" stroke="#E0E7FF"/>
    <rect x="226" y="196" width="42" height="42" rx="10" fill="url(#primaryGrad)"/>
    <path d="M 242 210 L 252 217 L 242 224" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="280" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#1E1B4B">
      AI Health Assistant Proyek
    </text>
    <text x="280" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#6366F1">
      3/4 Anggota Terpenuhi • Butuh UI/UX Designer
    </text>

    <!-- Team Members Row -->
    <g transform="translate(210, 274)">
      <!-- Member 1 -->
      <rect x="0" y="0" width="118" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="59" cy="40" r="22" fill="#E0E7FF"/>
      <circle cx="59" cy="34" r="10" fill="#4F46E5"/>
      <path d="M 44 55 Q 59 47 74 55" fill="#4F46E5"/>
      <text x="59" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Rian A.</text>
      <rect x="18" y="88" width="82" height="18" rx="9" fill="#EEF2FF"/>
      <text x="59" y="101" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#4F46E5" text-anchor="middle">Frontend Dev</text>

      <!-- Member 2 -->
      <rect x="131" y="0" width="118" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="190" cy="40" r="22" fill="#FEF3C7"/>
      <circle cx="190" cy="34" r="10" fill="#D97706"/>
      <path d="M 175 55 Q 190 47 205 55" fill="#D97706"/>
      <text x="190" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Sarah M.</text>
      <rect x="149" y="88" width="82" height="18" rx="9" fill="#FFFBEB"/>
      <text x="190" y="101" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">Data Scientist</text>

      <!-- Member 3 (Target Match) -->
      <rect x="262" y="0" width="118" height="120" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-dasharray="4 3"/>
      <circle cx="321" cy="40" r="22" fill="#DCFCE7"/>
      <text x="321" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#16A34A" text-anchor="middle">+</text>
      <text x="321" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">Kamu Disini</text>
      <rect x="280" y="88" width="82" height="18" rx="9" fill="#DCFCE7"/>
      <text x="321" y="101" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">UI/UX Designer</text>
    </g>

    <!-- Progress Match Bar -->
    <rect x="210" y="415" width="380" height="42" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="226" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#334155">
      Algoritma Keselarasan Tim
    </text>
    <rect x="420" y="428" width="120" height="14" rx="7" fill="#E2E8F0"/>
    <rect x="420" y="428" width="114" height="14" rx="7" fill="url(#primaryGrad)"/>
    <text x="554" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#4F46E5">
      98%
    </text>
  </g>

  <!-- Floating Badge Left: Match Alert -->
  <g filter="url(#badgeShadow)" transform="translate(60, 200)">
    <rect width="180" height="74" rx="18" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="36" cy="37" r="18" fill="url(#primaryGrad)"/>
    <path d="M 30 37 L 35 42 L 44 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F172A">Mitra Sesuai!</text>
    <text x="64" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#6366F1">Skor Kecocokan 98%</text>
    <text x="64" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">React • Figma • UI</text>
  </g>

  <!-- Floating Badge Right: Active Collaboration -->
  <g filter="url(#badgeShadow)" transform="translate(560, 320)">
    <rect width="180" height="70" rx="18" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="36" cy="35" r="18" fill="url(#secondaryGrad)"/>
    <path d="M 30 35 L 36 29 L 42 35 L 36 41 Z" fill="#FFFFFF"/>
    <text x="64" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F172A">Kolaborasi Aktif</text>
    <text x="64" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#D97706">500+ Mahasiswa</text>
    <text x="64" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">Terhubung Minggu Ini</text>
  </g>

  <!-- Floating Skill Badges -->
  <g filter="url(#badgeShadow)" transform="translate(100, 390)">
    <rect width="130" height="38" rx="19" fill="#1E1B4B"/>
    <circle cx="20" cy="19" r="6" fill="#10B981"/>
    <text x="34" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Fullstack Ready</text>
  </g>

  <g filter="url(#badgeShadow)" transform="translate(580, 160)">
    <rect width="140" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="22" cy="19" r="8" fill="#EEF2FF"/>
    <text x="22" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#4F46E5" text-anchor="middle">★</text>
    <text x="38" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1E293B">Terverifikasi Kampus</text>
  </g>
</svg>

